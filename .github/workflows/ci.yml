name: Pipeline CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar código do repositório
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Verificar versão do Python
      run: python --version

    - name: Executar testes unitários
      run: python -m unittest testes_unitarios/test_notas.py

    - name: Executar testes de integração
      run: python -m unittest testes_integracao/test_integracao_notas.py
